<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Ninja Weekly Offer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3e9d4;--ink:#111014;--red:#e3242b;--red2:#b5121b;--cream:#fff7e6;--gold:#f2b632}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper);font-family:'IBM Plex Sans Arabic',sans-serif;color:var(--ink)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--paper)}
.paper{position:absolute;inset:0;opacity:.55;mix-blend-mode:multiply}
.sun{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,var(--red) 0 60%,#d01e25 100%);
  left:90px;top:420px;animation:sunMove 24.5s cubic-bezier(.6,0,.3,1) both}
@keyframes sunMove{
  0%{transform:translate(0,0) scale(.2)}4%{transform:translate(0,0) scale(1)}
  10%{transform:translate(0,0) scale(1)}12%{transform:translate(0,-80px) scale(1.25)}
  28%{transform:translate(0,-80px) scale(1.25)}30%{transform:translate(260px,-420px) scale(.75)}
  45%{transform:translate(260px,-420px) scale(.75)}47%{transform:translate(-300px,-460px) scale(.65)}
  60%{transform:translate(-300px,-460px) scale(.65)}62%{transform:translate(280px,-430px) scale(.7)}
  75%{transform:translate(280px,-430px) scale(.7)}77%{transform:translate(0,-120px) scale(1.1)}
  100%{transform:translate(0,-120px) scale(1.15)}}
.ray{position:absolute;left:540px;top:870px;width:2400px;height:2400px;margin:-1200px 0 0 -1200px;
  background:repeating-conic-gradient(rgba(227,36,43,.10) 0 6deg,transparent 6deg 18deg);animation:rot 24.5s linear both}
@keyframes rot{to{transform:rotate(90deg)}}
.splat{position:absolute;background:var(--ink);border-radius:50%}
.frame{position:absolute;inset:28px;border:6px solid var(--ink);pointer-events:none}
.frame::after{content:"";position:absolute;inset:10px;border:2px solid var(--ink)}
.brand{position:absolute;top:70px;left:0;right:0;display:flex;justify-content:center;gap:18px;align-items:center;font-weight:700;font-size:42px;z-index:20}
.brand i{display:block;width:16px;height:16px;background:var(--red);transform:rotate(45deg)}

.scene{position:absolute;inset:0;opacity:0;animation:sIn .15s var(--s) both, sOut .25s var(--e) forwards;z-index:5}
@keyframes sIn{from{opacity:0}to{opacity:1}}
@keyframes sOut{from{opacity:1}to{opacity:0;transform:translateX(-120px) skewX(-8deg)}}
.c{position:absolute;left:0;right:0;text-align:center}

.slam{animation:slam .42s cubic-bezier(.2,.9,.3,1.25) var(--d) both}
@keyframes slam{0%{opacity:0;transform:scale(3) rotate(-8deg)}65%{opacity:1;transform:scale(.9) rotate(1deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.pop{animation:pop .45s cubic-bezier(.2,1.7,.4,1) var(--d) both}
@keyframes pop{from{opacity:0;transform:scale(.1) rotate(-25deg)}to{opacity:1;transform:scale(1) rotate(var(--rr,0deg))}}
.up{animation:up .4s cubic-bezier(.2,.9,.2,1) var(--d) both}
@keyframes up{from{opacity:0;transform:translateY(80px)}to{opacity:1;transform:none}}
.cutL{animation:cutL .35s cubic-bezier(.7,0,.2,1) var(--d) both}
@keyframes cutL{from{clip-path:polygon(100% 0,100% 0,100% 100%,100% 100%)}to{clip-path:polygon(-10% 0,100% 0,100% 100%,-10% 100%)}}
.halfT,.halfB{position:absolute;inset:0}
.halfT{clip-path:polygon(0 0,100% 0,100% 42%,0 58%);animation:hT .35s cubic-bezier(.2,.9,.2,1) var(--d) both}
.halfB{clip-path:polygon(0 58%,100% 42%,100% 100%,0 100%);animation:hB .35s cubic-bezier(.2,.9,.2,1) var(--d) both}
@keyframes hT{from{transform:translate(-160px,-40px);opacity:0}to{transform:none;opacity:1}}
@keyframes hB{from{transform:translate(160px,40px);opacity:0}to{transform:none;opacity:1}}

.brush{position:absolute;left:40px;right:40px;height:430px}
.brush svg.bg{position:absolute;inset:0;width:100%;height:100%}
.brush .in{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--cream)}
.t-huge{font-size:160px;font-weight:700;line-height:1.05}
.t-big{font-size:130px;font-weight:700;line-height:1.1}
.t-mid{font-size:64px;font-weight:600}
.t-sm{font-size:44px;font-weight:500}
.redt{color:var(--red)}

.slash{position:absolute;left:-100px;width:1400px;height:22px;transform-origin:0 50%;
  background:linear-gradient(180deg,transparent,var(--red) 20%,#fff 45%,#fff 55%,var(--red) 80%,transparent);
  filter:drop-shadow(0 0 18px rgba(227,36,43,.9));opacity:0;animation:slash .5s ease-out var(--d) both;z-index:30}
@keyframes slash{0%{opacity:1;transform:rotate(var(--r)) scaleX(0)}25%{opacity:1;transform:rotate(var(--r)) scaleX(1)}100%{opacity:0;transform:rotate(var(--r)) scaleX(1) scaleY(.1)}}

.smoke{position:absolute;width:0;height:0;z-index:25}
.smoke b{position:absolute;border-radius:50%;background:#d9cfbd;border:5px solid var(--ink);opacity:0;animation:puff .7s ease-out var(--d) both}
@keyframes puff{0%{opacity:1;transform:translate(0,0) scale(.1)}60%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1)}}

.nw{position:absolute;width:300px;height:390px;z-index:22}
.nw div{width:100%;height:100%}
.ninja{width:100%;height:100%;overflow:visible}
.tails{transform-origin:190px 55px;animation:wave .35s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-6deg)}to{transform:rotate(8deg)}}
.idle{animation:idle .9s ease-in-out infinite alternate}
@keyframes idle{from{transform:translateY(0) scaleY(1)}to{transform:translateY(8px) scaleY(.97)}}

.prices{position:absolute;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:60px;direction:ltr}
.old{position:relative;font-size:110px;font-weight:700;color:#5a544a}
.old .cut{position:absolute;left:-20px;right:-20px;top:48%;height:14px;background:var(--red);transform-origin:left;transform:rotate(-12deg) scaleX(0);
  animation:cut .18s ease-out var(--k) forwards;box-shadow:0 0 0 4px var(--paper)}
@keyframes cut{to{transform:rotate(-12deg) scaleX(1)}}
.new{font-size:290px;font-weight:700;line-height:.9;color:var(--red);text-shadow:10px 10px 0 var(--ink)}
.new small{font-size:130px;vertical-align:top;line-height:1.4}
.stamp{position:absolute;width:250px;height:250px;border:10px double var(--red);color:var(--red);border-radius:24px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;line-height:1;z-index:26;
  background:rgba(243,233,212,.85);animation:stamp .3s cubic-bezier(.3,1.6,.5,1) var(--d) both}
.stamp b{font-size:84px;direction:ltr}.stamp span{font-size:44px;margin-top:6px}
@keyframes stamp{0%{opacity:0;transform:scale(2.4) rotate(var(--rr))}100%{opacity:1;transform:scale(1) rotate(var(--rr))}}
.icon{width:150px;height:150px}
.btn{display:inline-block;background:var(--ink);color:var(--cream);font-size:96px;font-weight:700;padding:14px 70px 24px;border-radius:20px;box-shadow:12px 12px 0 var(--red)}
.url{direction:ltr;font-size:84px;font-weight:700;letter-spacing:1px}
.url b{display:inline-block;background:var(--cream);border:6px solid var(--ink);padding:0 50px 14px;border-radius:18px;box-shadow:10px 10px 0 var(--ink);font-weight:700}
.url span{color:var(--red)}
.flash{position:absolute;inset:0;background:#fff;z-index:40;opacity:0;animation:flash .3s ease-out var(--d) both;pointer-events:none}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
.shake{animation:shake .35s linear var(--d) both}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-16px,10px)}40%{transform:translate(14px,-12px)}60%{transform:translate(-10px,8px)}80%{transform:translate(6px,-4px)}}
.spinS{animation:spinS .3s linear infinite}
@keyframes spinS{to{transform:rotate(360deg)}}
.pulse{animation:pulse .7s ease-in-out var(--d) infinite alternate}
@keyframes pulse{to{transform:scale(1.07)}}
.lines{position:absolute;left:540px;width:0;height:0;z-index:4}
.lines i{position:absolute;left:0;top:0;width:520px;height:10px;background:var(--ink);transform-origin:0 50%;opacity:0;animation:speed .5s ease-out var(--d) both}
@keyframes speed{0%{opacity:1;transform:rotate(var(--a)) translateX(120px) scaleX(.1)}100%{opacity:0;transform:rotate(var(--a)) translateX(420px) scaleX(1)}}
@keyframes flipIn{0%{transform:translate(-520px,700px) rotate(-40deg)}55%{transform:translate(-160px,-420px) rotate(-250deg)}100%{transform:translate(0,0) rotate(-360deg)}}
@keyframes land{0%{transform:scale(1.15,.8) translateY(40px)}100%{transform:none}}
@keyframes hopIn{0%{transform:translate(400px,200px) rotate(30deg)}100%{transform:none}}
@keyframes throw{0%{transform:translate(0,0) scale(.6)}100%{transform:translate(-420px,-760px) scale(1.3);opacity:0}}
@keyframes flipAcross{0%{transform:translate(var(--fx),300px) rotate(0)}60%{transform:translate(calc(var(--fx) * .3),-160px) rotate(-560deg)}100%{transform:translate(0,0) rotate(-720deg)}}
@keyframes dropIn{0%{transform:translateY(-1500px) rotate(-720deg)}100%{transform:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="4"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .28  0 0 0 .55 0"/></filter>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="9"/><feDisplacementMap in="SourceGraphic" scale="26"/></filter>
    <symbol id="ninjaSym" viewBox="0 0 300 390" overflow="visible">
      <g class="tails"><path d="M190 52 C240 30 260 70 300 48" stroke="#e3242b" stroke-width="16" fill="none" stroke-linecap="round"/>
        <path d="M188 62 C230 70 250 100 288 92" stroke="#e3242b" stroke-width="13" fill="none" stroke-linecap="round"/></g>

      <rect x="104" y="128" width="92" height="132" rx="40" fill="#111014"/>
      <rect x="104" y="210" width="92" height="16" fill="#e3242b"/>
      <path d="M150 128 L130 200 M150 128 L170 200" stroke="#2a272e" stroke-width="6"/>
      <path d="M122 150 L82 200 L62 168" stroke="#111014" stroke-width="28" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M178 150 L222 196 L246 160" stroke="#111014" stroke-width="28" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="150" cy="78" r="62" fill="#111014"/>
      <rect x="92" y="38" width="116" height="18" rx="6" fill="#e3242b"/>
      <rect x="100" y="66" width="100" height="32" rx="16" fill="#f1d3a8"/>
      <path d="M114 82 Q126 72 138 82 Q126 90 114 82Z" fill="#111014"/>
      <path d="M162 82 Q174 72 186 82 Q174 90 162 82Z" fill="#111014"/>
      <path d="M112 70 L138 76 M188 70 L162 76" stroke="#111014" stroke-width="6" stroke-linecap="round"/>
      <circle cx="129" cy="81" r="2.5" fill="#fff"/><circle cx="177" cy="81" r="2.5" fill="#fff"/>
    </symbol>
    <symbol id="star" viewBox="-100 -100 200 200">
      <path fill="#111014" d="M0-95 L20-20 L95 0 L20 20 L0 95 L-20 20 L-95 0 L-20-20Z"/><circle r="18" fill="#f3e9d4"/><circle r="8" fill="#e3242b"/>
    </symbol>
    <symbol id="brushPath" viewBox="0 0 1000 430" preserveAspectRatio="none">
      <path filter="url(#rough)" fill="#111014" d="M30 90 C120 40 300 60 480 44 C650 30 820 50 975 70 C990 140 960 220 985 300 C990 350 960 380 900 392 C700 410 520 380 340 400 C200 410 90 395 40 380 C10 300 50 220 22 160Z"/>
      <path filter="url(#rough)" fill="#111014" d="M940 60 L1000 40 L985 90Z M10 380 L-10 410 L50 395Z"/>
    </symbol>
  </defs>
</svg>

<div id="stage">
  <svg class="paper" width="1080" height="1920"><rect width="100%" height="100%" filter="url(#grain)"/></svg>
  <div class="ray"></div>
  <div class="sun"></div>
  <div class="splat" style="width:40px;height:40px;left:120px;top:300px"></div>
  <div class="splat" style="width:18px;height:18px;left:180px;top:270px"></div>
  <div class="splat" style="width:26px;height:26px;right:140px;top:1700px"></div>
  <div class="splat" style="width:12px;height:12px;right:200px;top:1660px"></div>
  <div class="frame"></div>
  <div class="brand up" style="--d:.1s"><i></i> نينجا NINJA <i></i></div>

  <!-- 1 · Intro 0–2.5 -->
  <div class="scene" style="--s:0s;--e:2.35s">
    <div class="lines" style="top:1370px">
      <i style="--a:200deg;--d:.75s"></i><i style="--a:230deg;--d:.75s"></i><i style="--a:310deg;--d:.75s"></i><i style="--a:340deg;--d:.75s"></i><i style="--a:270deg;--d:.75s"></i>
    </div>
    <div class="nw" style="left:390px;top:1000px;animation:flipIn .8s cubic-bezier(.3,.7,.4,1) 0s both">
      <div style="animation:land .3s ease-out .78s both"><div class="idle"><svg class="ninja"><use href="#ninjaSym"/></svg></div></div>
    </div>
    <div class="smoke" style="left:540px;top:1380px">
      <b style="--d:.75s;width:160px;height:160px;left:-80px;top:-80px;--x:-200px;--y:-30px"></b>
      <b style="--d:.75s;width:130px;height:130px;left:-65px;top:-65px;--x:210px;--y:-20px"></b>
      <b style="--d:.78s;width:110px;height:110px;left:-55px;top:-55px;--x:-110px;--y:-90px"></b>
      <b style="--d:.78s;width:120px;height:120px;left:-60px;top:-60px;--x:120px;--y:-100px"></b>
    </div>
    <div class="slash" style="top:520px;--r:14deg;--d:1.0s"></div>
    <div class="brush" style="top:430px">
      <div class="halfT" style="--d:1.05s"><svg class="bg"><use href="#brushPath"/></svg><div class="in"><div class="t-huge">عرض الأسبوع</div></div></div>
      <div class="halfB" style="--d:1.05s"><svg class="bg"><use href="#brushPath"/></svg><div class="in"><div class="t-huge">عرض الأسبوع</div></div></div>
    </div>
    <div class="c t-mid up" style="top:900px;--d:1.4s">برمجة <span class="redt">مواقع</span> و<span class="redt">تطبيقات</span></div>
  </div>

  <!-- 2 · 50% 2.5–7.0 -->
  <div class="scene" style="--s:2.5s;--e:6.85s">
    <div class="nw" style="left:640px;top:1380px;animation:hopIn .4s cubic-bezier(.3,.7,.4,1) 2.5s both">
      <div class="idle"><svg class="ninja"><use href="#ninjaSym"/></svg></div>
    </div>
    <div style="position:absolute;left:740px;top:1460px;width:150px;height:150px;animation:throw .38s cubic-bezier(.4,0,.8,.6) 2.72s both;z-index:24">
      <svg class="spinS" width="150" height="150"><use href="#star"/></svg>
    </div>
    <div class="flash" style="--d:3.08s"></div>
    <div class="c t-big up" style="top:330px;--d:2.6s">خصم</div>
    <div class="c shake" style="top:520px;--d:3.15s">
      <div class="slam new" style="--d:3.08s;font-size:400px;direction:ltr;color:var(--cream)">50%</div>
    </div>
    <div style="position:absolute;top:470px;left:830px;z-index:6">
      <svg width="160" height="160" class="pop" style="--d:3.1s;--rr:20deg"><use href="#star"/></svg>
    </div>
    <div class="brush" style="top:1000px;height:300px">
      <div class="cutL" style="--d:4.1s;position:absolute;inset:0"><svg class="bg"><use href="#brushPath"/></svg>
        <div class="in"><div class="t-mid">على برمجة المواقع والتطبيقات</div><div class="t-sm" style="color:var(--gold)">لفترة محدودة</div></div></div>
    </div>
  </div>

  <!-- 3 · Website 7.0–11.0 -->
  <div class="scene" style="--s:7.0s;--e:10.85s">
    <div class="nw" style="left:60px;top:150px;animation:flipAcross .6s cubic-bezier(.3,.7,.4,1) 7.0s both;--fx:900px">
      <div class="idle"><svg class="ninja" style="transform:scale(.8)"><use href="#ninjaSym"/></svg></div>
    </div>
    <div class="smoke" style="left:210px;top:470px">
      <b style="--d:7.55s;width:140px;height:140px;left:-70px;top:-70px;--x:-120px;--y:20px"></b>
      <b style="--d:7.55s;width:120px;height:120px;left:-60px;top:-60px;--x:140px;--y:10px"></b>
    </div>
    <div class="brush" style="top:620px">
      <div class="cutL" style="--d:7.25s;position:absolute;inset:0"><svg class="bg"><use href="#brushPath"/></svg>
        <div class="in">
          <svg class="icon" viewBox="0 0 100 100" fill="none" stroke="#fff7e6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="8" y="16" width="84" height="64" rx="8"/><path d="M8 32h84"/><path d="M38 50l-10 8 10 8M62 50l10 8-10 8" stroke="#e3242b"/></svg>
          <div class="t-big">موقع تعريفي</div>
        </div></div>
    </div>
    <div class="prices" style="top:1170px">
      <div class="old up" style="--d:7.8s">$70<span class="cut" style="--k:8.5s"></span></div>
      <div class="shake" style="--d:8.65s"><div class="new slam" style="--d:8.55s"><small>$</small>35</div></div>
    </div>
    <div class="slash" style="top:1270px;--r:-12deg;--d:8.45s"></div>
    <div class="stamp" style="left:70px;top:1500px;--d:9.1s;--rr:-12deg"><b>-50%</b><span>خصم</span></div>
    <div class="c t-mid up" style="top:1560px;left:300px;--d:9.3s">فقط!</div>
  </div>

  <!-- 4 · App 11.0–14.7 -->
  <div class="scene" style="--s:11.0s;--e:14.55s">
    <div class="nw" style="left:740px;top:150px;animation:flipAcross .6s cubic-bezier(.3,.7,.4,1) 11.0s both;--fx:-900px">
      <div class="idle"><svg class="ninja" style="transform:scale(-.8,.8)"><use href="#ninjaSym"/></svg></div>
    </div>
    <div class="smoke" style="left:880px;top:470px">
      <b style="--d:11.55s;width:140px;height:140px;left:-70px;top:-70px;--x:-140px;--y:20px"></b>
      <b style="--d:11.55s;width:120px;height:120px;left:-60px;top:-60px;--x:120px;--y:10px"></b>
    </div>
    <div class="brush" style="top:620px">
      <div class="cutL" style="--d:11.25s;position:absolute;inset:0"><svg class="bg" style="transform:scaleX(-1)"><use href="#brushPath"/></svg>
        <div class="in">
          <svg class="icon" viewBox="0 0 100 100" fill="none" stroke="#fff7e6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="27" y="6" width="46" height="88" rx="10"/><path d="M43 15h14"/><rect x="37" y="30" width="11" height="11" rx="3" stroke="#e3242b"/><rect x="53" y="30" width="11" height="11" rx="3" stroke="#e3242b"/><rect x="37" y="47" width="11" height="11" rx="3" stroke="#e3242b"/><rect x="53" y="47" width="11" height="11" rx="3" stroke="#e3242b"/></svg>
          <div class="t-big">تطبيق جوال</div>
        </div></div>
    </div>
    <div class="prices" style="top:1170px">
      <div class="old up" style="--d:11.7s">$190<span class="cut" style="--k:12.2s"></span></div>
      <div class="shake" style="--d:12.35s"><div class="new slam" style="--d:12.25s"><small>$</small>95</div></div>
    </div>
    <div class="slash" style="top:1260px;--r:12deg;--d:12.15s"></div>
    <div class="stamp" style="right:70px;top:1500px;--d:12.8s;--rr:12deg"><b>-50%</b><span>خصم</span></div>
    <div class="c t-mid up" style="top:1560px;right:300px;--d:13.0s">فقط!</div>
  </div>

  <!-- 5 · Store 14.7–18.5 -->
  <div class="scene" style="--s:14.7s;--e:18.35s">
    <div class="nw" style="left:60px;top:150px;animation:flipAcross .6s cubic-bezier(.3,.7,.4,1) 14.7s both;--fx:900px">
      <div class="idle"><svg class="ninja" style="transform:scale(.8)"><use href="#ninjaSym"/></svg></div>
    </div>
    <div class="smoke" style="left:210px;top:470px">
      <b style="--d:15.25s;width:140px;height:140px;left:-70px;top:-70px;--x:-120px;--y:20px"></b>
      <b style="--d:15.25s;width:120px;height:120px;left:-60px;top:-60px;--x:140px;--y:10px"></b>
