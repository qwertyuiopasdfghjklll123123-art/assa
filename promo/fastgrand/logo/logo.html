<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:transparent;font-family:'IBM Plex Sans Arabic',sans-serif}
.v{display:none;padding:40px}
.icon{width:1024px;height:1024px;border-radius:28%;background:linear-gradient(160deg,#294376,#1E2F52);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 6px 0 rgba(255,255,255,.18)}
.icon svg{width:62%;height:62%}
.lock{display:flex;align-items:center;gap:56px;padding:60px 80px}
.lock .icon{width:300px;height:300px}
.lock .w{font-weight:600;font-size:230px;letter-spacing:-4px;line-height:1}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><symbol id="fc" viewBox="0 0 100 100">
  <path d="M20 22h34M20 22v56M20 48h26" stroke="#fff" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M84 33A24 24 0 1 0 84 67" stroke="#3CC8F0" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M4 66h8M4 80h14" stroke="#3CC8F0" stroke-width="6" stroke-linecap="round"/>
</symbol></defs></svg>
<div class="v" id="icon"><div class="icon"><svg><use href="#fc"/></svg></div></div>
<div class="v" id="light" style="background:#FDFDFB"><div class="lock"><div class="icon"><svg><use href="#fc"/></svg></div><div class="w" style="color:#1E2F52">FastCrand</div></div></div>
<div class="v" id="dark" style="background:linear-gradient(180deg,#294376,#1E2F52)"><div class="lock"><div class="icon" style="border:4px solid rgba(255,255,255,.35)"><svg><use href="#fc"/></svg></div><div class="w" style="color:#fff">FastCrand</div></div></div>
</body></html>
