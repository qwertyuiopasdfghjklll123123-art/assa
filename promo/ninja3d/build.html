<html><head><meta charset="utf-8"><title>Ninja GLB builder</title>

<script type="module">
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { buildNinja } from './src/ninja-model.js';
import { bakeClip } from './src/ninja-anim.js';
const ninja = buildNinja(THREE);
const clip = bakeClip(THREE, ninja, 60);
// export from the rest pose (frame 0 is applied by the mixer on load)
new GLTFExporter().parse(ninja, (buf) => {
  const bytes = new Uint8Array(buf); let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  window.__glb = btoa(s);
}, (e) => console.error(e), { binary: true, animations: [clip] });
</script></body></html>
