<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef4f5">
<title>__SITE_NAME__</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/pwa-192.png">
<link rel="icon" type="image/png" href="/pwa-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/assets/ui.css?v=4">
<style>
  .topbar{position:fixed;top:0;left:0;right:0;z-index:50;height:calc(64px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 16px 0;display:flex;align-items:center;justify-content:space-between;background:rgba(238,244,245,.82);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);transition:box-shadow .2s}
  [data-theme="dark"] .topbar{background:rgba(7,26,30,.82)}
  .topbar.scrolled{box-shadow:0 1px 0 var(--line2)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:var(--primary-deep)}
  [data-theme="dark"] .brand{color:var(--text)}
  .brand .top-logo{border-radius:12px;box-shadow:0 6px 14px var(--primary-glow)}
  .top-actions{display:flex;align-items:center;gap:8px}
  .bal-chip{display:flex;align-items:center;gap:7px;height:42px;padding:0 6px 0 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:800;font-size:14px}
  .bal-chip .plus{width:30px;height:30px;border-radius:50%;background:var(--hero);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}
  .round-btn{position:relative;width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:16px}
  main{max-width:640px;margin:0 auto;padding:calc(76px + env(safe-area-inset-top,0px)) 16px calc(120px + env(safe-area-inset-bottom,0px))}
  .page-head{display:flex;align-items:center;gap:12px;margin:0 2px 16px}
  .page-head h2{font-size:22px;font-weight:800;flex:1;letter-spacing:-.3px}
  .page-head .back{width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--primary)}
  .page{animation:pageIn .38s cubic-bezier(.2,.8,.2,1) both}
  @keyframes pageIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
  /* منيو سفلي داكن عائم مع زر وسطي مرتفع */
  .bnav{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:0 14px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
  .bnav-in{pointer-events:auto;position:relative;max-width:480px;margin:0 auto;height:68px;display:flex;align-items:center;padding:0 8px;background:linear-gradient(140deg,#03343c,#034f5c);border-radius:34px;box-shadow:0 16px 36px rgba(3,52,60,.38)}
  .bnav-it{flex:1;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:26px;font-size:10.5px;font-weight:700;color:rgba(255,255,255,.55);transition:color .2s,background .25s}
  .bnav-it i{font-size:18px;transition:transform .3s cubic-bezier(.2,1.6,.4,1)}
  .bnav-it.on{color:#fff;background:rgba(255,255,255,.12)}
  .bnav-it.on i{transform:translateY(-1px) scale(1.12)}
  .bnav-gap{flex:0 0 70px}
  .fab{position:absolute;left:50%;top:-22px;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;background:linear-gradient(140deg,#0aa2b8,#04788b);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 26px rgba(4,120,139,.5),0 0 0 6px var(--bg);transition:transform .2s}
  .fab:active{transform:translateX(-50%) scale(.92)}
  .fab.on{background:linear-gradient(140deg,#f59e0b,#d97706);box-shadow:0 12px 26px rgba(217,119,6,.45),0 0 0 6px var(--bg)}
  /* الرئيسية */
  .greet{display:flex;align-items:center;gap:12px}
  .avatar{flex:none;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.95);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;box-shadow:0 6px 14px rgba(0,0,0,.12)}
  .hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
  .hero-stats div{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:9px 6px;text-align:center}
  .hero-stats b{display:block;font-size:17px}
  .hero-stats span{font-size:10.5px;opacity:.85}
  .status-dot{width:9px;height:9px;border-radius:50%;background:var(--text3);display:inline-block}
  .status-dot.on{background:var(--green);box-shadow:0 0 0 4px var(--green-bg)}
  .qr-frame{background:#fff;border-radius:24px;padding:16px;display:flex;justify-content:center;box-shadow:inset 0 0 0 2px var(--line)}
  .qr-frame img{width:230px;height:230px}
  .pair-code{font-size:34px;font-weight:800;letter-spacing:5px;text-align:center;direction:ltr;color:#fff;background:var(--hero);border-radius:24px;padding:16px;box-shadow:0 12px 26px var(--primary-glow)}
  .receipt{width:100%;max-height:360px;object-fit:contain;border-radius:20px;background:var(--input);cursor:zoom-in}
  .receipt.big{max-height:none;cursor:zoom-out}
  .mini-list .row{padding:11px 14px}
  .code-block{direction:ltr;text-align:left;background:#03343c;color:#bdeef5;border-radius:20px;padding:14px;font-size:12px;overflow:auto;white-space:pre;font-family:ui-monospace,monospace}
  @media (min-width:900px){ main{max-width:720px} }
</style>
</head>
<body>
<header class="topbar" id="topbar">
  <div class="brand" onclick="go('home')">__LOGO_SM__<span id="brandName">__SITE_NAME__</span></div>
  <div class="top-actions">
    <button class="bal-chip" onclick="go('wallet')"><span class="num" id="balChip">0</span><span style="font-size:11px;color:var(--text3)">د.ع</span><span class="plus"><i class="fa-solid fa-plus"></i></span></button>
    <button class="round-btn" onclick="go('notifications')" aria-label="الإشعارات"><i class="fa-solid fa-bell"></i><span class="badge-dot hidden" id="bellDot"></span></button>
  </div>
</header>
<main id="view"></main>
<nav class="bnav"><div class="bnav-in" id="bnav">
  <button class="bnav-it" data-p="home"><i class="fa-solid fa-house-chimney"></i><span>الرئيسية</span></button>
  <button class="bnav-it" data-p="accounts"><i class="fa-brands fa-whatsapp"></i><span>أرقامي</span></button>
  <span class="bnav-gap"></span>
  <button class="bnav-it" data-p="wallet"><i class="fa-solid fa-gem"></i><span>الباقات</span></button>
  <button class="bnav-it" data-p="account"><i class="fa-solid fa-user"></i><span>حسابي</span></button>
  <button class="fab" data-p="campaign" aria-label="حملة جديدة"><i class="fa-solid fa-paper-plane"></i></button>
</div></nav>

<!-- نافذة تثبيت التطبيق: تطلع من الأسفل وتختفي -->
<div class="sheet-bg" id="pwaBg" onclick="closeInstall()"></div>
<div class="sheet" id="pwaSheet" role="dialog" aria-label="تثبيت التطبيق">
  <div class="sheet-handle"></div>
  <img class="sheet-logo" src="/pwa-192.png" alt="">
  <h3>ثبّت __SITE_NAME__ على جوالك</h3>
  <p id="pwaText">افتحه بلمسة من شاشتك الرئيسية مثل أي تطبيق</p>
  <div class="sheet-feats"><span><i class="fa-solid fa-bolt"></i> فتح فوري</span><span><i class="fa-solid fa-bell"></i> إشعارات</span><span><i class="fa-solid fa-expand"></i> شاشة كاملة</span></div>
  <button class="btn btn-primary btn-block" id="pwaInstall"><i class="fa-solid fa-download"></i> تثبيت التطبيق</button>
  <button class="btn btn-ghost btn-block" style="margin-top:10px" onclick="closeInstall(true)">لاحقاً</button>
</div>
<div class="toast" id="toast"></div>
<script>window.BOOT = __BOOT_JSON__;</script>
<script src="/assets/app.js?v=4"></script>
</body>
</html>
