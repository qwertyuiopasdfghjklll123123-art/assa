<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
__UI_HEAD__
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>__SITE_NAME__</title>
<link rel="manifest" href="/app.webmanifest">
<link rel="apple-touch-icon" href="/pwa-192.png">
<link rel="icon" type="image/png" href="/pwa-192.png">
<link rel="preload" href="/assets/vendor/plex-arabic-400.woff2?v=__V__" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/vendor/fa-solid.woff2?v=__V__" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/vendor/fonts.css?v=__V__">
<link rel="stylesheet" href="/assets/vendor/fa.css?v=__V__">
<link rel="stylesheet" href="/assets/ui.css?v=__V__">
<style>
  .topbar{position:fixed;top:0;left:0;right:0;z-index:50;height:calc(66px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 18px 0;display:flex;align-items:center;justify-content:space-between;transition:background .3s,box-shadow .3s}
  .topbar.scrolled{background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 1px 0 rgba(255,255,255,.9),0 8px 20px rgba(3,79,92,.05)}
  [data-mode=dark] .topbar.scrolled{box-shadow:0 1px 0 rgba(255,255,255,.05),0 8px 20px rgba(0,0,0,.3)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;color:var(--text);cursor:pointer}
  .brand .top-logo{border-radius:11px;box-shadow:0 6px 14px var(--primary-glow)}
  .top-actions{display:flex;align-items:center;gap:8px}
  .bal-chip{display:flex;align-items:center;gap:7px;height:42px;padding:0 15px;border-radius:999px;background:var(--card);border:1px solid var(--glass-line);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--shadow);font-weight:800;font-size:14.5px;color:var(--primary)}
  .bal-chip i{font-size:14px}
  .bal-chip small{font-size:11px;color:var(--text3);font-weight:600}
  .round-btn{position:relative;width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--glass-line);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--shadow);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:16px}
  main{max-width:620px;margin:0 auto;padding:calc(78px + env(safe-area-inset-top,0px)) 18px calc(120px + env(safe-area-inset-bottom,0px))}
  .page-head{display:flex;align-items:center;gap:12px;margin:0 2px 16px}
  .page-head h2{font-size:22px;font-weight:800;flex:1;letter-spacing:-.3px}
  .page-head .back{width:42px;height:42px;border-radius:14px;background:var(--card);border:1px solid var(--glass-line);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--primary)}
  .page{animation:pageIn .28s var(--ease) both}
  @keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  /* منيو كبسولة: الصفحة المفتوحة تتوسع ويظهر اسمها */
  .bnav{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:0 16px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
  .bnav-in{pointer-events:auto;max-width:440px;margin:0 auto;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-radius:999px;background:color-mix(in srgb,var(--surface) 78%,transparent);border:1px solid var(--glass-line);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 18px 40px rgba(3,79,92,.16)}
  .bnav-it{height:48px;min-width:48px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;color:#6b8a90;font-size:13px;font-weight:700;transition:padding .45s var(--ease),background .35s,color .3s,box-shadow .35s}
  .bnav-it i{font-size:18px;transition:transform .45s var(--ease)}
  .bnav-it .t{max-width:0;overflow:hidden;white-space:nowrap;opacity:0;transition:max-width .45s var(--ease),opacity .3s}
  .bnav-it.on{background:var(--btn);color:#fff;padding:0 18px;box-shadow:0 8px 18px var(--primary-glow)}
  .bnav-it.on .t{max-width:90px;opacity:1}
  /* الرئيسية */
  .greet{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 16px}
  .greet small{font-size:12.5px;color:var(--text3)}
  .greet h2{font-size:23px;font-weight:800;letter-spacing:-.3px}
  .avatar{flex:none;width:48px;height:48px;border-radius:50%;background:var(--surface);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;box-shadow:0 8px 18px rgba(3,79,92,.12)}
  .hc-top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px}
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);display:inline-block}
  .status-dot.on{background:var(--green);box-shadow:0 0 0 4px var(--green-bg)}
  .qr-frame{background:var(--surface);border-radius:22px;padding:16px;display:flex;justify-content:center;border:1px solid var(--line)}
  .qr-frame img{width:230px;height:230px}
  .pair-code{font-size:34px;font-weight:800;letter-spacing:5px;text-align:center;direction:ltr;color:var(--primary);background:var(--primary-bg);border:1px dashed color-mix(in srgb,var(--primary) 30%,transparent);border-radius:20px;padding:16px}
  .receipt{width:100%;max-height:360px;object-fit:contain;border-radius:18px;background:rgba(3,79,92,.04);cursor:zoom-in}
  .receipt.big{max-height:none;cursor:zoom-out}
  .mini-list .row{padding:11px 14px}
  .code-block{direction:ltr;text-align:left;background:#05343c;color:#bdeef5;border-radius:18px;padding:14px;font-size:12px;overflow:auto;white-space:pre;font-family:ui-monospace,monospace}
  @media (min-width:900px){ main{max-width:700px} }
</style>
</head>
<body>
<header class="topbar" id="topbar">
  <div class="brand" onclick="go('home')">__LOGO_SM__<span id="brandName">__SITE_NAME__</span></div>
  <div class="top-actions">
    <button class="bal-chip" onclick="go('wallet')"><i class="fa-solid fa-wallet"></i><span class="num" id="balChip">0</span><small>د.ع</small></button>
    <button class="round-btn" onclick="go('notifications')" aria-label="الإشعارات"><i class="fa-regular fa-bell"></i><span class="badge-dot hidden" id="bellDot"></span></button>
  </div>
</header>
<main id="view"></main>
<nav class="bnav"><div class="bnav-in" id="bnav">
  <button class="bnav-it" data-p="home"><i class="fa-solid fa-house"></i><span class="t">الرئيسية</span></button>
  <button class="bnav-it" data-p="campaign"><i class="fa-solid fa-paper-plane"></i><span class="t">الحملات</span></button>
  <button class="bnav-it" data-p="accounts"><i class="fa-brands fa-whatsapp"></i><span class="t">أرقامي</span></button>
  <button class="bnav-it" data-p="account"><i class="fa-solid fa-user"></i><span class="t">حسابي</span></button>
</div></nav>

<!-- نافذة تثبيت التطبيق: تطلع من الأسفل وتختفي -->
<div class="sheet-bg" id="pwaBg" onclick="closeInstall(true)"></div>
<div class="sheet" id="pwaSheet" role="dialog" aria-label="تثبيت التطبيق">
  <div class="sheet-handle"></div>
  <img class="sheet-logo" src="/pwa-192.png" alt="">
  <h3>ثبّت __SITE_NAME__ على جوالك</h3>
  <p id="pwaText">افتحه بلمسة من شاشتك الرئيسية مثل أي تطبيق</p>
  <div class="sheet-feats"><span><i class="fa-solid fa-bolt"></i> فتح فوري</span><span><i class="fa-solid fa-bell"></i> إشعارات</span><span><i class="fa-solid fa-expand"></i> شاشة كاملة</span></div>
  <button class="btn btn-primary btn-block" id="pwaInstall"><i class="fa-solid fa-download"></i> تثبيت التطبيق</button>
  <button class="btn btn-ghost btn-block" style="margin-top:10px" onclick="closeInstall(true)">لاحقاً</button>
</div>
<!-- نافذة التأكيد: تطلع من الأسفل -->
<div class="sheet-bg" id="cfBg"></div>
<div class="sheet" id="cfSheet" role="dialog" aria-modal="true">
  <div class="sheet-handle"></div>
  <div class="confirm-ic ic-red" id="cfIc"><i class="fa-solid fa-triangle-exclamation"></i></div>
  <h3 id="cfTitle">تأكيد</h3>
  <p id="cfText"></p>
  <div class="row-actions"><button class="btn btn-ghost" id="cfNo">إلغاء</button><button class="btn btn-danger" id="cfYes">تأكيد</button></div>
</div>
<div class="toast" id="toast"></div>
<script>window.BOOT = __BOOT_JSON__;</script>
<script src="/assets/app.js?v=__V__"></script>
</body>
</html>
