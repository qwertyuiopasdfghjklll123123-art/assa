<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f4f0">
<title>__SITE_NAME__</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/pwa-192.png">
<link rel="icon" type="image/png" href="/pwa-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/assets/ui.css?v=3">
<style>
  .topbar{position:fixed;top:0;left:0;right:0;z-index:50;height:calc(60px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 16px 0;display:flex;align-items:center;justify-content:space-between;background:var(--bg);transition:box-shadow .2s}
  .topbar.scrolled{box-shadow:0 1px 0 var(--line)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;color:var(--primary);letter-spacing:-.3px}
  .brand .top-logo,.brand .logo-default{border-radius:10px}
  .top-actions{display:flex;align-items:center;gap:8px}
  .bal-chip{display:flex;align-items:center;gap:8px;height:42px;padding:0 6px 0 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);font-weight:800;font-size:14px}
  .bal-chip .plus{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
  .round-btn{position:relative;width:42px;height:42px;border-radius:50%;background:var(--primary-bg);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:16px;border:1px solid var(--line)}
  main{max-width:640px;margin:0 auto;padding:calc(70px + env(safe-area-inset-top,0px)) 14px calc(110px + env(safe-area-inset-bottom,0px))}
  .page-head{display:flex;align-items:center;gap:10px;margin:2px 2px 14px}
  .page-head h2{font-size:20px;font-weight:800;flex:1}
  .page-head .back{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
  .page{animation:pageIn .32s cubic-bezier(.2,.8,.2,1) both}
  @keyframes pageIn{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
  /* المنيو السفلي العائم */
  .bnav{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
  .bnav-in{pointer-events:auto;max-width:520px;margin:0 auto;display:flex;gap:4px;padding:7px;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 34px rgba(34,26,18,.12)}
  .bnav-it{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:17px;font-size:11px;font-weight:700;color:var(--text3);transition:background .2s,color .2s}
  .bnav-it i{font-size:19px;transition:transform .25s cubic-bezier(.2,1.6,.4,1)}
  .bnav-it.on{background:var(--primary-bg);color:var(--primary)}
  .bnav-it.on i{transform:translateY(-2px) scale(1.08)}
  /* بطاقة الترحيب */
  .welcome-hero{display:flex;align-items:center;gap:12px}
  .avatar{flex:none;width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.95);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:21px}
  .hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .hero-stats div{background:rgba(255,255,255,.13);border-radius:13px;padding:8px;text-align:center}
  .hero-stats b{display:block;font-size:16px}
  .hero-stats span{font-size:10.5px;opacity:.85}
  .acc-card{display:flex;align-items:center;gap:12px}
  .status-dot{width:9px;height:9px;border-radius:50%;background:var(--text3);display:inline-block}
  .status-dot.on{background:var(--green);box-shadow:0 0 0 4px var(--green-bg)}
  .qr-frame{background:#fff;border-radius:18px;padding:14px;display:flex;justify-content:center;border:1px solid var(--line)}
  .qr-frame img{width:230px;height:230px}
  .pair-code{font-size:32px;font-weight:800;letter-spacing:4px;text-align:center;direction:ltr;color:var(--primary);background:var(--primary-bg);border-radius:16px;padding:14px}
  .install-card{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;border:0}
  .install-card .row-ic{background:rgba(255,255,255,.1);color:#fff}
  .receipt{width:100%;max-height:360px;object-fit:contain;border-radius:14px;background:var(--input);cursor:zoom-in}
  .receipt.big{max-height:none;cursor:zoom-out}
  .pm-logo{width:100%;height:100%;object-fit:cover}
  .mini-list .row{padding:11px 12px}
  .code-block{direction:ltr;text-align:left;background:#0f172a;color:#cbd5e1;border-radius:14px;padding:12px;font-size:12px;overflow:auto;white-space:pre;font-family:ui-monospace,monospace}
  @media (min-width:900px){ main{max-width:720px} }
</style>
</head>
<body>
<header class="topbar" id="topbar">
  <div class="brand" onclick="go('home')">__LOGO_SM__<span id="brandName">__SITE_NAME__</span></div>
  <div class="top-actions">
    <button class="bal-chip" onclick="go('wallet')"><span class="num" id="balChip">0</span><span style="font-size:11px;color:var(--text3)">د.ع</span><span class="plus"><i class="fa-solid fa-plus"></i></span></button>
    <button class="round-btn" onclick="go('notifications')" aria-label="الإشعارات"><i class="fa-solid fa-bell"></i><span class="badge-dot hidden" id="bellDot"></span></button>
  </div>
</header>
<main id="view"></main>
<nav class="bnav"><div class="bnav-in" id="bnav">
  <button class="bnav-it" data-p="home"><i class="fa-solid fa-house"></i><span>الرئيسية</span></button>
  <button class="bnav-it" data-p="campaign"><i class="fa-solid fa-paper-plane"></i><span>الحملات</span></button>
  <button class="bnav-it" data-p="accounts"><i class="fa-brands fa-whatsapp"></i><span>أرقامي</span></button>
  <button class="bnav-it" data-p="wallet"><i class="fa-solid fa-credit-card"></i><span>الشحن</span></button>
  <button class="bnav-it" data-p="account"><i class="fa-solid fa-user"></i><span>حسابي</span></button>
</div></nav>
<div class="toast" id="toast"></div>
<script>window.BOOT = __BOOT_JSON__;</script>
<script src="/assets/app.js?v=3"></script>
</body>
</html>
