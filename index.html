<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Hamza — Portfolio</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
/* === MOBILE STYLES (الأصلي بدون تغيير) === */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-ms-touch-action:manipulation;scroll-behavior:smooth}
:root{--bg:#f4f6fb;--card:#fff;--text:#1a1d2e;--muted:#7a8094;--blue:#4f8eff;--cyan:#00b4d8;--gold:#f0a030;--pink:#ff6b9d;--shadow:0 1px 2px rgba(16,24,40,0.04),0 6px 18px rgba(16,24,40,0.07);--safe-b:env(safe-area-inset-bottom,0px);--border:rgba(0,0,0,0.04);--hover-bg:rgba(0,0,0,0.03)}
[data-theme="dark"]{--bg:#1c130d;--card:#2a1d14;--text:#f5e6d3;--muted:#a89380;--blue:#7ba8ff;--cyan:#4ed4f5;--gold:#ffc874;--pink:#ff8fb5;--shadow:0 1px 2px rgba(0,0,0,0.3),0 6px 20px rgba(0,0,0,0.35);--border:rgba(245,230,211,0.06);--hover-bg:rgba(245,230,211,0.04)}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);width:100%;max-width:100%;margin:0;padding:0 0 20px 0;min-height:100vh;min-height:100dvh;overflow-x:hidden;position:relative;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:background 0.3s,color 0.3s}
::selection{background:var(--blue);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(127,134,160,0.35);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:rgba(127,134,160,0.55)}
.bg-orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0}
.bo1{width:300px;height:300px;background:rgba(79,142,255,0.07);top:-100px;right:-80px}
.bo2{width:200px;height:200px;background:rgba(0,180,216,0.05);bottom:20%;left:-60px}
[data-theme="dark"] .bo1{background:rgba(180,120,80,0.12)}
[data-theme="dark"] .bo2{background:rgba(140,90,60,0.10)}
.z1{position:relative;z-index:1;width:100%;max-width:460px;margin:0 auto}
.st{height:env(safe-area-inset-top,20px);min-height:20px}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;position:relative;z-index:100}
.hdr .logo{font-size:1rem;font-weight:900;letter-spacing:0.5px;background:linear-gradient(135deg,var(--blue),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-right{display:flex;align-items:center;gap:8px}
.m-theme-btn{width:34px;height:34px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.85rem;color:var(--text);transition:transform 0.15s cubic-bezier(.4,0,.2,1),box-shadow 0.2s;flex-shrink:0}
.m-theme-btn:active{transform:scale(0.86) rotate(-8deg);box-shadow:0 1px 6px rgba(0,0,0,0.08)}
.m-theme-btn .sun{display:none}
.m-theme-btn .moon{display:inline}
[data-theme="dark"] .m-theme-btn .sun{display:inline;color:var(--gold)}
[data-theme="dark"] .m-theme-btn .moon{display:none}
.lang-btn{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:100px;background:var(--card);box-shadow:var(--shadow);border:none;cursor:pointer;font-family:'Tajawal',sans-serif;font-size:0.72rem;font-weight:700;color:var(--text);transition:transform 0.15s cubic-bezier(.4,0,.2,1),box-shadow 0.2s}
.lang-btn:active{transform:scale(0.93)}
.lang-dropdown{position:absolute;top:100%;left:0;right:auto;margin-top:6px;background:var(--card);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,0.12);overflow:hidden;z-index:200;opacity:0;transform:translateY(-8px) scale(0.95);pointer-events:none;transition:all 0.2s;min-width:160px}
[dir="rtl"] .lang-dropdown{left:auto;right:0}
.lang-dropdown.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.lang-opt{display:flex;align-items:center;gap:10px;padding:11px 16px;font-size:0.75rem;font-weight:600;cursor:pointer;transition:background 0.15s,transform 0.15s cubic-bezier(.4,0,.2,1);border:none;background:none;width:100%;font-family:'Tajawal',sans-serif;color:var(--text)}
.lang-opt:hover{background:rgba(79,142,255,0.06)}
.lang-opt:active{background:rgba(79,142,255,0.1);transform:scale(0.96)}
.lang-opt .flag{font-size:1.1rem}
.lang-opt.active{color:var(--blue)}
.lang-opt.active::after{content:'✓';margin-right:auto;margin-left:0;color:var(--blue);font-weight:800;font-size:0.7rem}
[dir="ltr"] .lang-opt.active::after{margin-left:auto;margin-right:0}
.lang-wrap{position:relative;z-index:200}
.prof{margin:8px 16px 16px;border-radius:22px;padding:24px 18px;background:linear-gradient(135deg,var(--blue),var(--cyan));position:relative;overflow:hidden;color:#fff;box-shadow:0 8px 28px rgba(79,142,255,0.2);transition:background 0.3s,box-shadow 0.3s,color 0.3s}
.prof::before{content:'';position:absolute;top:0;right:0;width:200px;height:200px;background:radial-gradient(circle,rgba(255,255,255,0.1),transparent);pointer-events:none}
.prof::after{content:'';position:absolute;bottom:-30px;left:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.06)}
[data-theme="dark"] .prof{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
[data-theme="dark"] .prof::before,[data-theme="dark"] .prof::after{display:none}
[data-theme="dark"] .p-av{background:linear-gradient(135deg,var(--blue),var(--cyan));border-color:rgba(123,168,255,0.3);backdrop-filter:none}
[data-theme="dark"] .p-info p{color:var(--muted);opacity:1}
.p-row{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.p-av{width:62px;height:62px;border-radius:20px;background:rgba(255,255,255,0.2);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;flex-shrink:0;border:2px solid rgba(255,255,255,0.3);overflow:hidden;padding:0;position:relative;box-shadow:0 0 0 4px rgba(255,255,255,0.12),0 8px 20px rgba(0,0,0,0.18)}
[data-theme="dark"] .p-av{box-shadow:0 0 0 4px rgba(123,168,255,0.15),0 8px 20px rgba(0,0,0,0.3)}
.p-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.p-av i{font-size:1.5rem;color:#fff}
.p-info h2{font-size:1.05rem;font-weight:800;letter-spacing:-0.2px;margin-bottom:2px}
.p-info p{font-size:0.68rem;opacity:0.9}
.p-info .online{display:inline-flex;align-items:center;gap:4px;font-size:0.58rem;color:#b8ffb8;margin-top:4px}
.p-info .online .dot{width:5px;height:5px;border-radius:50%;background:#80ff80;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.shimmer{position:relative;overflow:hidden}
.shimmer::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(79,142,255,0.05),rgba(255,255,255,0.35),rgba(79,142,255,0.05),transparent);pointer-events:none;z-index:2;opacity:0}
[data-theme="dark"] .shimmer::after{background:linear-gradient(90deg,transparent,rgba(245,230,211,0.04),rgba(245,230,211,0.12),rgba(245,230,211,0.04),transparent)}
.shimmer.shimmer-go::after{opacity:1;animation:shimmer 1s ease-in-out forwards;animation-delay:var(--sd,0s)}
@keyframes shimmer{0%{left:-100%}100%{left:150%}}
.prof.shimmer::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,0.08),rgba(255,255,255,0.25),rgba(255,255,255,0.08),transparent)}
.sec{margin-bottom:20px}
.sh{display:flex;align-items:center;justify-content:space-between;padding:0 16px;margin-bottom:10px}
.sh h3{font-size:0.85rem;font-weight:800;display:flex;align-items:center;gap:8px;letter-spacing:0.1px}
.sh h3 i{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;background:var(--hover-bg);border-radius:8px;font-size:0.78em;flex-shrink:0}
.sh .al{font-size:0.65rem;color:var(--blue);font-weight:600}
.abt{margin:0 16px;background:var(--card);border-radius:18px;padding:16px;font-size:0.8rem;line-height:1.9;color:var(--muted);box-shadow:var(--shadow)}
.wks{padding:0 16px}
.wk{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:12px;margin-bottom:8px;box-shadow:var(--shadow);transition:transform 0.15s cubic-bezier(.4,0,.2,1),box-shadow 0.2s}
.wk:active{transform:scale(0.96);box-shadow:0 1px 6px rgba(0,0,0,0.06)}
.wk-i{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1rem;color:#fff;flex-shrink:0}
.wk-t{flex:1;min-width:0}
.wk-t h4{font-size:0.8rem;font-weight:700;margin-bottom:1px}
.wk-t p{font-size:0.65rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk .st-b{padding:3px 8px;border-radius:6px;font-size:0.5rem;font-weight:700;flex-shrink:0}
.st-on{background:linear-gradient(135deg,rgba(0,180,216,0.18),rgba(0,180,216,0.05));color:var(--cyan);border:1px solid rgba(0,180,216,0.2);box-shadow:0 0 8px rgba(0,180,216,0.15)}
.st-dv{background:linear-gradient(135deg,rgba(240,160,48,0.18),rgba(240,160,48,0.05));color:var(--gold);border:1px solid rgba(240,160,48,0.2)}
.wk .cv{color:#d0d4e0;font-size:0.6rem;flex-shrink:0}
[data-theme="dark"] .wk .cv{color:var(--muted);opacity:0.5}
.art-list{padding:0 16px}
.b-art{background:var(--card);border-radius:18px;padding:16px;margin-bottom:10px;box-shadow:var(--shadow);position:relative;overflow:hidden;cursor:pointer;transition:transform 0.15s cubic-bezier(.4,0,.2,1),box-shadow 0.2s}
.b-art:active{transform:scale(0.97);box-shadow:0 1px 6px rgba(0,0,0,0.06)}
.b-art-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.b-art-badge{font-size:0.55rem;padding:4px 10px;border-radius:8px;font-weight:700}
.bb-bl{background:linear-gradient(135deg,rgba(79,142,255,0.16),rgba(79,142,255,0.04));color:var(--blue);border:1px solid rgba(79,142,255,0.18)}.bb-pk{background:linear-gradient(135deg,rgba(255,107,157,0.16),rgba(255,107,157,0.04));color:var(--pink);border:1px solid rgba(255,107,157,0.18)}.bb-cn{background:linear-gradient(135deg,rgba(0,180,216,0.16),rgba(0,180,216,0.04));color:var(--cyan);border:1px solid rgba(0,180,216,0.18)}
.b-art-date{font-size:0.58rem;color:var(--muted);display:flex;align-items:center;gap:4px}
.b-art h4{font-size:0.85rem;font-weight:700;margin-bottom:6px;line-height:1.5}
.b-art p{font-size:0.72rem;color:var(--muted);line-height:1.6}
.b-art-footer{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid rgba(0,0,0,0.04)}
[data-theme="dark"] .b-art-footer{border-top-color:var(--border)}
.b-art-read{font-size:0.65rem;color:var(--blue);font-weight:700;display:flex;align-items:center;gap:4px}
.b-art-time{font-size:0.55rem;color:var(--muted);display:flex;align-items:center;gap:3px}
.sk-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px}
.sk-card{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
.sk-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:0.9rem;color:#fff;flex-shrink:0}
.sk-info{flex:1;min-width:0}
.sk-info .sk-name{font-size:0.72rem;font-weight:700;margin-bottom:4px}
.sk-bar{height:3px;background:rgba(0,0,0,0.06);border-radius:3px;overflow:hidden}
[data-theme="dark"] .sk-bar{background:rgba(245,230,211,0.08)}
.sk-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--cyan));box-shadow:0 0 8px rgba(79,142,255,0.5)}
.ct-card{margin:0 16px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;display:flex;align-items:center;justify-content:center;gap:10px;transition:background 0.3s}
.ct-icons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ct-btn{width:34px;height:34px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:0.85rem;color:var(--muted);text-decoration:none;transition:transform 0.15s cubic-bezier(.4,0,.2,1),background 0.2s,color 0.2s,box-shadow 0.2s}
.ct-btn:active{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;transform:scale(0.88);box-shadow:0 4px 14px rgba(79,142,255,0.35)}
.footer{text-align:center;padding:16px;font-size:0.58rem;color:var(--muted)}
.color-map-blue{background:linear-gradient(135deg,#4f8eff,#3a6fcc)}
.color-map-pink{background:linear-gradient(135deg,#ff6b9d,#e84a80)}
.color-map-cyan{background:linear-gradient(135deg,#00b4d8,#0090aa)}
.color-map-gold{background:linear-gradient(135deg,#f0a030,#d09020)}
.color-map-green{background:linear-gradient(135deg,#22c55e,#16a34a)}
.color-map-purple{background:linear-gradient(135deg,#8b5cf6,#7c3aed)}
.loading{text-align:center;padding:40px;color:var(--muted);font-size:0.8rem}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.an{animation:fadeUp 0.35s both}

.rip-host{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;transform:scale(0);pointer-events:none;background:rgba(255,255,255,0.55)}
.rip.go{animation:ripAnim 0.6s ease-out forwards}
[data-theme="dark"] .rip{background:rgba(255,255,255,0.2)}
@keyframes ripAnim{to{transform:scale(2.6);opacity:0}}

.tw-cursor::after{content:'';display:inline-block;width:2px;height:0.9em;margin-inline-start:2px;background:currentColor;vertical-align:-0.1em;animation:twBlink 0.8s steps(1) infinite}
@keyframes twBlink{0%,49%{opacity:1}50%,100%{opacity:0}}

.desktop-only{display:none}

/* === DESKTOP STYLES (فوق 1024px فقط) === */
@media (min-width:1024px){
  .mobile-only{display:none !important}
  .desktop-only{display:block}
  :root{--shadow-hover:0 12px 32px rgba(79,142,255,0.12);--orb1:rgba(79,142,255,0.07);--orb2:rgba(0,180,216,0.05);--orb3:rgba(255,107,157,0.04);--nav-bg:rgba(244,246,251,0.85)}
  [data-theme="dark"]{--shadow-hover:0 12px 32px rgba(123,168,255,0.15);--orb1:rgba(180,120,80,0.12);--orb2:rgba(140,90,60,0.10);--orb3:rgba(200,140,90,0.08);--nav-bg:rgba(28,19,13,0.85)}
  body{padding:0}
  .bo1{width:500px;height:500px;background:var(--orb1);top:-200px;right:-100px}
  .bo2{width:400px;height:400px;background:var(--orb2);bottom:10%;left:-150px}
  .bo3{width:300px;height:300px;background:var(--orb3);top:40%;right:30%;display:block}
  .navbar{position:sticky;top:0;z-index:100;backdrop-filter:blur(20px);background:var(--nav-bg);border-bottom:1px solid var(--border);padding:14px 0;transition:background 0.3s,border 0.3s}
  .nav-wrap{max-width:1280px;margin:0 auto;padding:0 32px;display:flex;align-items:center;justify-content:space-between;gap:24px}
  .nav-logo{font-size:1.3rem;font-weight:900;letter-spacing:0.5px;background:linear-gradient(135deg,var(--blue),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .nav-links{display:flex;gap:6px;align-items:center}
  .nav-link{padding:8px 16px;border-radius:100px;font-size:0.85rem;font-weight:600;color:var(--muted);text-decoration:none;transition:transform 0.15s cubic-bezier(.4,0,.2,1),background 0.2s,color 0.2s,box-shadow 0.2s;cursor:pointer;display:inline-block}
  .nav-link:hover{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
  .nav-link:active{transform:scale(0.93)}
  .nav-controls{display:flex;align-items:center;gap:10px;position:relative}
  .d-lang-btn,.theme-btn{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:100px;background:var(--card);box-shadow:var(--shadow);border:1px solid transparent;cursor:pointer;font-family:'Tajawal',sans-serif;font-size:0.78rem;font-weight:700;color:var(--text);transition:transform 0.15s cubic-bezier(.4,0,.2,1),box-shadow 0.2s,border-color 0.25s}
  .d-lang-btn:hover,.theme-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-hover);border-color:rgba(79,142,255,0.25)}
  .d-lang-btn:active,.theme-btn:active{transform:scale(0.92);box-shadow:var(--shadow)}
  .theme-btn{width:38px;height:38px;padding:0;justify-content:center;font-size:0.95rem}
  .theme-btn .sun{display:none}
  .theme-btn .moon{display:inline}
  [data-theme="dark"] .theme-btn .sun{display:inline;color:var(--gold)}
  [data-theme="dark"] .theme-btn .moon{display:none}
  .d-lang-wrap{position:relative}
  .d-lang-dropdown{position:absolute;top:100%;left:0;right:auto;margin-top:8px;background:var(--card);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,0.12);overflow:hidden;z-index:200;opacity:0;transform:translateY(-8px) scale(0.95);pointer-events:none;transition:all 0.2s;min-width:170px}
  [dir="rtl"] .d-lang-dropdown{left:auto;right:0}
  .d-lang-dropdown.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
  .d-container{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:32px;display:grid;grid-template-columns:340px 1fr;gap:32px;align-items:start}
  .d-sidebar{display:flex;flex-direction:column;gap:20px}
  .d-prof{padding:0;margin:0;background:none;box-shadow:none;color:inherit}
  .d-prof::before,.d-prof::after{display:none}
  .d-pav{width:100%;aspect-ratio:1;border-radius:22px;background:var(--card);border:2px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;box-shadow:var(--shadow);transition:transform 0.2s cubic-bezier(.4,0,.2,1),border-color 0.25s,background 0.25s;cursor:pointer;backdrop-filter:none;padding:0}
  .d-pav:hover{border-color:var(--blue);background:var(--hover-bg)}
  .d-pav:active{transform:scale(0.98)}
  .d-pav i{font-size:3.5rem;color:var(--muted);opacity:0.5;transition:all 0.25s}
  .d-pav:hover i{color:var(--blue);opacity:0.7;transform:scale(1.05)}
  .d-pav .ph-text{font-size:0.78rem;color:var(--muted);font-weight:600;letter-spacing:0.3px;transition:color 0.3s}
  .d-pav img{width:100%;height:100%;object-fit:cover}
  .d-pav.has-img{border-style:solid;border-color:transparent;box-shadow:0 0 0 3px var(--card),0 0 0 6px rgba(79,142,255,0.35),var(--shadow-hover)}
  .d-pav.has-img i,.d-pav.has-img .ph-text{display:none}
  .d-name-strip{background:var(--card);border-radius:18px;padding:16px 20px;text-align:center;box-shadow:var(--shadow);transition:background 0.3s}
  .d-name-strip h2{font-size:1.3rem;font-weight:800;color:var(--text);letter-spacing:-0.3px;transition:color 0.3s;margin:0}
  .d-name-strip .role{font-size:0.72rem;color:var(--muted);font-weight:600;margin-top:4px;transition:color 0.3s}
  .d-name-strip .online{display:inline-flex;align-items:center;gap:5px;font-size:0.62rem;color:#22c55e;background:rgba(34,197,94,0.1);padding:3px 10px;border-radius:100px;margin-top:8px;font-weight:700}
  .d-name-strip .online .dot{width:5px;height:5px;border-radius:50%;background:#22c55e;animation:blink 2s infinite}
  .d-side-card{background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--shadow);transition:background 0.3s,box-shadow 0.3s}
  .d-side-title{display:flex;align-items:center;gap:10px;font-size:0.85rem;font-weight:700;margin-bottom:14px;color:var(--text);transition:color 0.3s}
  .d-side-title i{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;background:var(--hover-bg);border-radius:9px;font-size:0.85em;flex-shrink:0}

const RIPPLE_SEL='.lang-btn,.m-theme-btn,.theme-btn,.d-lang-btn,.ct-btn,.footer-ic,.nav-link,.lang-opt,.d-sec-head .all';
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest(RIPPLE_SEL);
  if(!el)return;
  el.classList.add('rip-host');
  const r=el.getBoundingClientRect();
  const size=Math.max(r.width,r.height)*1.4;
  const span=document.createElement('span');
  span.className='rip go';
  span.style.width=span.style.height=size+'px';
  span.style.left=(e.clientX-r.left-size/2)+'px';
  span.style.top=(e.clientY-r.top-size/2)+'px';
  el.appendChild(span);
  span.addEventListener('animationend',()=>span.remove());
});

function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':'dark';
  if(next==='dark')document.documentElement.setAttribute('data-theme','dark');
  else document.documentElement.removeAttribute('data-theme');
  try{localStorage.setItem('theme',next)}catch(e){}
}

    DATA=await r.json();

function typeText(el){
  if(el.dataset.typed)return;
  const full=el.dataset.full;
  if(!full){el.dataset.typed='1';return}
  el.dataset.typed='1';
  el.textContent='';
  el.classList.add('tw-cursor');
  const delay=Math.max(8,Math.min(32,900/full.length));
  let i=0;
  (function step(){
    i++;
    el.textContent=full.slice(0,i);
    if(i<full.length)setTimeout(step,delay);
    else el.classList.remove('tw-cursor');
  })();
}

function prepareTypewriters(){
  document.querySelectorAll('.tw-block').forEach(el=>{
    if(el.dataset.full===undefined){
      el.dataset.full=el.textContent;
      el.textContent='';
    }
  });
}

function setupShimmer(){
  prepareTypewriters();
  const obs=new IntersectionObserver(es=>{es.forEach(e=>{
    if(!e.isIntersecting)return;
    const t=e.target;
    if(t.classList.contains('shimmer')){
      t.classList.add('shimmer-go');
      const d=parseFloat(getComputedStyle(t).getPropertyValue('--sd'))||0;
      setTimeout(()=>t.classList.remove('shimmer-go'),1000+d*1000);
    }
    if(t.classList.contains('tw-block')){
      typeText(t);
    }else{
      const tw=t.querySelector('.tw');
      if(tw)typeText(tw);
    }
  })},{threshold:0.3});
  document.querySelectorAll('.shimmer,.tw-block,.sh,.d-sec-head,.d-side-title').forEach(el=>obs.observe(el));
}

let _lastDesktop=isDesktop();
window.addEventListener('resize',()=>{const cur=isDesktop();if(cur!==_lastDesktop){_lastDesktop=cur;render();}});

loadData();
